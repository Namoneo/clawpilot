name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clawpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/nest-api/package-lock.json
      
      - name: Install dependencies
        working-directory: backend/nest-api
        run: npm ci
      
      - name: Run linter
        working-directory: backend/nest-api
        run: npm run lint
      
      - name: Run tests
        working-directory: backend/nest-api
        run: npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: clawpilot_test
          JWT_SECRET: test-secret
      
      - name: Build
        working-directory: backend/nest-api
        run: npm run build

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/angular-dashboard/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend/angular-dashboard
        run: npm ci
      
      - name: Run linter
        working-directory: frontend/angular-dashboard
        run: npm run lint
      
      - name: Run tests
        working-directory: frontend/angular-dashboard
        run: npm run test -- --no-watch
      
      - name: Build
        working-directory: frontend/angular-dashboard
        run: npm run build

  # AI Orchestrator Tests
  orchestrator-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: orchestrator/fastapi-ai/requirements.txt
      
      - name: Install dependencies
        working-directory: orchestrator/fastapi-ai
        run: pip install -r requirements.txt
      
      - name: Type check
        working-directory: orchestrator/fastapi-ai
        run: |
          python -m py_compile main.py
      
      - name: Lint
        working-directory: orchestrator/fastapi-ai
        run: pip install ruff && ruff check .

  # Worker Tests
  worker-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: worker/requirements.txt
      
      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements.txt
      
      - name: Type check
        working-directory: worker
        run: |
          python -m py_compile main.py

  # Docker Build
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, orchestrator-test, worker-test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build NestJS API
        uses: docker/build-push-action@v5
        with:
          context: ./backend/nest-api
          push: false
          tags: clawpilot/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build FastAPI AI
        uses: docker/build-push-action@v5
        with:
          context: ./orchestrator/fastapi-ai
          push: false
          tags: clawpilot/ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Worker
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: false
          tags: clawpilot/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy
  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # e.g., kubectl apply -f k8s/
          # or docker-compose -f infra/docker-compose.yml up -d
